name: deepectransformer
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.6
  - pytorch=1.7.0
  - cudatoolkit=10.2   # required for V100; A100 will fail "no kernel image"
  - pip
  - pip:
    - transformers==3.5.1
    - tqdm
    - numpy
    - pandas
    - biopython
# Plus DeepProZyme repo's deepec package (not on PyPI):
#   git clone https://github.com/kaistsystemsbiology/DeepProZyme.git
#   cd DeepProZyme && pip install -e .
